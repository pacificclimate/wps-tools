[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "wps-tools"
version = "2.1.3"
readme = "README.md"
description = "A collection of modules used to help create wps processes"
authors = [
    { name = "Nikola Rados"},
    { name = "Sangwon Lim"},
    { name = "Cairo Sanders"},
    { name ="Eric Yvorchuk", email = "eyvorchuk@uvic.ca"},
]
classifiers=[
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = [
    "wps",
    "pywps",
    "climate",
    "climate data"
]
dynamic = [ "dependencies" ]

[tool.poetry]
package-mode = false
packages = [
    {include = "wps_tools"},
]
include = [
    "tests/data/*.nc",
    "tests/processes/*.py",
]
[[tool.poetry.source]]
name = "pcic"
url = "https://pypi.pacificclimate.org/simple"
priority = "supplemental"


[tool.poetry.dependencies]
python = ">=3.10,<4"
pywps = ">=4.2.6"
nchelpers = { version = "^5.5.11", source = "pcic" }
netCDF4 = ">=1.5.4"
beautifulsoup4 = "==4.13.4"
rpy2 = {version = "==3.3.6", optional = true }
pytest = { version = ">=8.2.1", optional = true }
black  = { version = ">=22.3.0", optional = true }


[tool.poetry.extras]
r        = ["rpy2"]
test     = ["pytest","black"]
complete = ["rpy2","pytest","black"]

[project.optional-dependencies]
r = ["rpy2==3.3.6"]
test = ["pytest>=8.2.1", "black>=22.3.0"]
complete = ["rpy2==3.3.6", "pytest>=8.2.1", "black>=22.3.0"]

[tool.pytest.ini_options]
markers = [
    "online: marks tests that use online resources (deselect with '-m \"not online\"')",
    "slow: marks tests that are slow (deselect with '-m \"not slow\"')",
]

[project.urls]
homepage   = "http://www.pacificclimate.org/"
repository = "https://github.com/pacificclimate/wps-tools"