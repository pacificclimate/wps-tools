[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "wps-tools"
version = "2.1.3"
requires-python = ">=3.10,<=3.14"
readme = "README.md"
description = "A collection of modules used to help create wps processes"
authors = [
    { name = "Nikola Rados" },
    { name = "Sangwon Lim" },
    { name = "Cairo Sanders" },
    { name = "Eric Yvorchuk", email = "eyvorchuk@uvic.ca" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["wps", "pywps", "climate", "climate data"]
dependencies = [
    "beautifulsoup4>=4.13.4,<5.0.0",
    "nchelpers>=5.5.11,<6.0.0",
    "netcdf4>=1.7.2,<2.0.0",
    "pywps>=4.6.0,<5.0.0",
]

[project.optional-dependencies]
r = ["rpy2==3.3.6"]
test = ["black>=25.1.0,<26.0.0", "pytest>=8.3.5,<9.0.0"]
complete = [
    "black>=25.1.0,<26.0.0",
    "pytest>=8.3.5,<9.0.0",
    "rpy2>=3.3.6,<4.0.0",
]

[project.urls]
homepage = "http://www.pacificclimate.org/"
repository = "https://github.com/pacificclimate/wps-tools"

[[tool.poetry.source]]
name = "pcic"
url = "https://pypi.pacificclimate.org/simple"
priority = "supplemental"

[tool.pytest.ini_options]
markers = [
    "online: marks tests that use online resources (deselect with '-m \"not online\"')",
    "slow: marks tests that are slow (deselect with '-m \"not slow\"')",
]
