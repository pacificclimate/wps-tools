name: Python CI

on: push

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install R and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base
          echo "R installed successfully"

      - name: Install cdo and poetry
        run: |
          sudo apt-get update
          sudo apt-get -y install cdo
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          poetry --version

      - id: cache-poetry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies if changed
        if: ${{ steps.cache-poetry.outputs.cache-hit != 'true' }}
        run: |
          poetry env use python${{ matrix.python-version }}
          poetry install --extras "complete"

      - name: Test with pytest (full)
        if: github.ref == 'refs/heads/master'
        run: |
          poetry run pytest -m "not online" -v

      - name: Test with pytest (fast)
        if: github.ref != 'refs/heads/master'
        run: |
          poetry run pytest -m "not online and not slow" -v

      - name: Code Quality
        run: poetry run black . --check
